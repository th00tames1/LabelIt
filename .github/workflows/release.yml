name: Release

# Builds installers on each target platform and publishes them to a GitHub
# Release. Native dependencies (better-sqlite3, sharp) must be compiled on the
# platform they run on, so every artifact is produced by a matching runner.
#
# Trigger by pushing a version tag:
#   git tag v1.5.0 && git push origin v1.5.0
# or run the workflow manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # "--publish never" stops electron-builder from uploading to the release
        # itself. Otherwise all four jobs race to create and patch the same
        # release and push auto-update metadata this app does not use.
        # Publishing happens exactly once, in the release job below.
        include:
          - name: Windows (x64)
            os: windows-latest
            command: npm run build:win -- --publish never
            artifact: windows-x64
          # macos-13 was retired and macos-14 is deprecated, so both macOS jobs
          # target the macOS 15 images: -intel for x64, the default for arm64.
          - name: macOS (Intel)
            os: macos-15-intel
            command: npm run build:mac -- --x64 --publish never
            artifact: macos-x64
          - name: macOS (Apple Silicon)
            os: macos-15
            command: npm run build:mac -- --arm64 --publish never
            artifact: macos-arm64
          - name: Linux (x64)
            os: ubuntu-latest
            command: npm run build:linux -- --publish never
            artifact: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}
        env:
          # There is no Developer ID in the runner keychain, so stop
          # electron-builder from searching for one. The afterSign hook applies
          # an ad-hoc signature instead (see scripts/adhoc-sign-mac.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the macOS app is signed
        # 1.5.1 shipped an Intel build with no signature at all, which macOS
        # refuses to launch. Fail the build here rather than publish that again.
        if: runner.os == 'macOS'
        run: |
          app=$(find dist -maxdepth 2 -name 'LabelIt.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::No LabelIt.app found under dist/"
            exit 1
          fi
          echo "Verifying $app"
          codesign --verify --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Signature|Identifier|TeamIdentifier' || true

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Run even if one platform failed or could not be scheduled, so a single
    # unavailable runner does not withhold the installers that did build.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify at least one installer was produced
        run: |
          ls -lh artifacts || true
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No installers were produced by any platform."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            Download the installer for your platform below.

            | Platform | File |
            | --- | --- |
            | Windows 10/11 (x64) | `LabelIt-*-Setup.exe` |
            | macOS (Apple Silicon) | `LabelIt-*-mac-arm64.dmg` |
            | macOS (Intel) | `LabelIt-*-mac-x64.dmg` |
            | Linux (x64) | `LabelIt-*-linux-x86_64.AppImage` or `LabelIt-*-linux-amd64.deb` |

            macOS builds are not signed with an Apple Developer certificate. On
            first launch, right-click the app and choose Open, or allow it under
            System Settings > Privacy & Security.
