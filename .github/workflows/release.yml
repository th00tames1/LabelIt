name: Release

# Builds installers on each target platform and publishes them to a GitHub
# Release. Native dependencies (better-sqlite3, sharp) must be compiled on the
# platform they run on, so every artifact is produced by a matching runner.
#
# Trigger by pushing a version tag:
#   git tag v1.5.0 && git push origin v1.5.0
# or run the workflow manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # "--publish never" stops electron-builder from uploading to the release
        # itself. Otherwise all four jobs race to create and patch the same
        # release and push auto-update metadata this app does not use.
        # Publishing happens exactly once, in the release job below.
        include:
          - name: Windows (x64)
            os: windows-latest
            command: npm run build:win -- --publish never
            artifact: windows-x64
          # macos-13 was retired and macos-14 is deprecated, so both macOS jobs
          # target the macOS 15 images: -intel for x64, the default for arm64.
          # sharp_arch uses npm's naming (x64), macho_arch uses the name lipo
          # reports (x86_64). They differ, and conflating them made the
          # verification step reject correct builds.
          - name: macOS (Intel)
            os: macos-15-intel
            command: npm run build:mac -- --x64 --publish never
            artifact: macos-x64
            sharp_platform: darwin
            sharp_arch: x64
            macho_arch: x86_64
          - name: macOS (Apple Silicon)
            os: macos-15
            command: npm run build:mac -- --arm64 --publish never
            artifact: macos-arm64
            sharp_platform: darwin
            sharp_arch: arm64
            macho_arch: arm64
          - name: Linux (x64)
            os: ubuntu-latest
            command: npm run build:linux -- --publish never
            artifact: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Install the target-architecture sharp binaries
        # sharp ships its native code as per-platform optional dependencies, and
        # npm resolves those against the RUNNER's architecture. The Intel job
        # therefore installed sharp-darwin-arm64, which both broke signature
        # verification and would have crashed the app on any Intel Mac. Force the
        # packages matching the artifact we are actually building.
        if: matrix.sharp_platform != ''
        run: |
          npm install --no-save --force \
            --os=${{ matrix.sharp_platform }} --cpu=${{ matrix.sharp_arch }} \
            sharp@$(node -p "require('./package.json').dependencies.sharp.replace('^','')")
          echo "Installed @img packages:"
          ls node_modules/@img

      - name: Build installer
        run: ${{ matrix.command }}
        env:
          # There is no Developer ID in the runner keychain, so stop
          # electron-builder from searching for one. The afterSign hook applies
          # an ad-hoc signature instead (see scripts/adhoc-sign-mac.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the macOS app architecture and signature
        # History that shaped this step: 1.5.1 shipped an unsigned Intel build;
        # 1.5.2 shipped an Intel package carrying arm64 sharp because the mac
        # target listed both arches, so EACH job built BOTH and the artifacts
        # cross-contaminated. Targets are now single-arch per job, and this step
        # checks every app produced: the main executable and every bundled
        # native addon must contain the target architecture, and the bundle must
        # verify against its ad-hoc signature. Verification is deliberately
        # NOT --deep: the plain check is what the shipped-and-working 1.5.2
        # arm64 build actually passed, and it validates the outer resource seal
        # that covers the unpacked native modules.
        if: runner.os == 'macOS'
        run: |
          apps=$(find dist -maxdepth 2 -name 'LabelIt.app')
          if [ -z "$apps" ]; then
            echo "::error::No LabelIt.app found under dist/"
            exit 1
          fi

          # lipo reports Mach-O names (x86_64 / arm64), which differ from npm's
          # arch names (x64 / arm64). Compare against the Mach-O spelling.
          expected="${{ matrix.macho_arch }}"
          bad=0

          while IFS= read -r app; do
            echo "=== $app (expecting $expected) ==="

            main_archs=$(lipo -archs "$app/Contents/MacOS/LabelIt" 2>/dev/null || echo unreadable)
            case " $main_archs " in
              *" $expected "*) echo "  ok   [$main_archs] main executable" ;;
              *) echo "::error::Main executable is [$main_archs], expected $expected: $app"; bad=1 ;;
            esac

            while IFS= read -r node_file; do
              archs=$(lipo -archs "$node_file" 2>/dev/null || echo unreadable)
              case " $archs " in
                *" $expected "*) echo "  ok   [$archs] $node_file" ;;
                *) echo "::error::Wrong architecture [$archs], expected $expected: $node_file"; bad=1 ;;
              esac
            done < <(find "$app" -name '*.node')

            if codesign --verify --verbose=2 "$app"; then
              echo "  ok   signature verifies"
            else
              echo "::error::Signature verification failed: $app"
              bad=1
            fi
          done <<< "$apps"

          [ "$bad" -eq 0 ] || exit 1

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Publish only when every platform succeeded. This previously ran with
    # always(), and that is how 1.5.2 went out with a broken Intel build even
    # though its verification step had failed. A partial release is worse than a
    # late one: users download whatever is attached and hit the broken file.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify at least one installer was produced
        run: |
          ls -lh artifacts || true
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No installers were produced by any platform."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            Download the installer for your platform below.

            | Platform | File |
            | --- | --- |
            | Windows 10/11 (x64) | `LabelIt-*-Setup.exe` |
            | macOS (Apple Silicon) | `LabelIt-*-mac-arm64.dmg` |
            | macOS (Intel) | `LabelIt-*-mac-x64.dmg` |
            | Linux (x64) | `LabelIt-*-linux-x86_64.AppImage` or `LabelIt-*-linux-amd64.deb` |

            macOS builds are not signed with an Apple Developer certificate. On
            first launch, right-click the app and choose Open, or allow it under
            System Settings > Privacy & Security.
